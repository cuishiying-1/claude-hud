[package]
name = "claude-hud"
version = "0.1.0"
edition = "2021"
description = "Dual-mode terminal HUD for Claude Code: compact status bar + full-screen TUI dashboard"
license = "MIT"
repository = "https://github.com/user/claude-hud"

[[bin]]
name = "claude-hud"
path = "src/main.rs"

[dependencies]
# Time (no default "clock" feature: iana-time-zone needs dlltool on Windows,
# and we only format UTC timestamps, never local time)
chrono = { version = "0.4", default-features = false, features = ["std"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Terminal
crossterm = "0.28"
ratatui = "0.29"

# Configuration
toml = "0.8"

# Scripting (Phase 3)
rhai = "1"

# HTTP (Phase 3: web dashboard + http polling)
ureq = "2"
tiny_http = "0.12"

# Database (Phase 2)
rusqlite = { version = "0.32", features = ["bundled"] }

# OS notifications (Phase 2)
notify-rust = "4"

# Filesystem
dirs = "5"

# 终端宽度测量（Phase 4 ⑮）
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
